<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V80 V81 FIXED</title><style>body{background:#020a18;color:#00ff88;font-family:monospace;margin:0;padding:10px}input{width:100%;padding:12px;margin:5px 0;background:#001a33;color:#0f8;border:1px solid #0f8;border-radius:6px;box-sizing:border-box}button{width:100%;padding:14px;background:#0f8;color:#000;font-weight:bold;border:none;border-radius:6px}#log{background:#000;border:1px solid #0f8;height:300px;overflow:auto;padding:6px;font-size:11px;white-space:pre-wrap}</style></head><body><h2 style="text-align:center">V80 LIVE PAT V81 ✅ FIXED</h2><input id="pat" type="text" placeholder="Paste PAT pat_..."><input id="aid" value="1089"><button onclick="go()">CONNECT WITH PAT</button><div>Status:<span id="s">Disconn</span> Bal:<span id="b">-</span></div><div id="log">READY V81 - Paste PAT + CONNECT</div><script>let ws;function lg(m){let e=document.getElementById('log');e.textContent+="\n"+m;e.scrollTop=e.scrollHeight}function go(){let t=document.getElementById('pat').value.trim();let a=document.getElementById('aid').value.trim()||"1089";if(a.length>8)a="1089";if(!t){lg("Paste PAT!");return}lg("Connecting app_id="+a+" len="+t.length);document.getElementById('s').textContent="Connecting...";ws=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id="+a);ws.onopen=()=>{lg("WS Open -> auth");ws.send(JSON.stringify({authorize:t}))};ws.onmessage=(m)=>{lg("RX:"+m.data.slice(0,400));try{let d=JSON.parse(m.data);if(d.authorize){document.getElementById('s').textContent="Connected ✅ "+d.authorize.loginid;document.getElementById('b').textContent=d.authorize.balance+" "+d.authorize.currency;lg("SUCCESS! Balance:"+d.authorize.balance)}if(d.error)lg("ERR:"+d.error.message)}catch(e){}};ws.onerror=()=>lg("WS error");ws.onclose=()=>lg("WS closed")}</script></body></html>
