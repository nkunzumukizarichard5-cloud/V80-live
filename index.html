<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V80 FINAL</title><style>body{background:#020a18;color:#0f8;font-family:monospace;padding:10px}input{width:100%;padding:12px;margin:5px 0;background:#001a33;color:#0f8;border:1px solid #0f8;border-radius:6px}button{width:100%;padding:14px;background:#0f8;color:#000;font-weight:bold;border-radius:6px}#log{background:#000;border:1px solid #0f8;height:350px;overflow:auto;padding:6px;font-size:11px;white-space:pre-wrap}</style></head><body><h2>V80 LIVE PAT V81 FINAL ✅ FIXED</h2><input id="pat" placeholder="Paste PAT pat_..."><input id="aid" value="1089"><button onclick="go()">CONNECT WITH PAT</button><div>Status:<span id="s">Off</span> Bal:<span id="b">-</span></div><div id="log">READY FINAL - Will try 2 servers
Paste PAT no spaces</div><script>let ws;function lg(m){let e=document.getElementById('log');e.textContent+="\n"+new Date().toLocaleTimeString()+" "+m;e.scrollTop=e.scrollHeight}function connect(url,t){lg("Trying "+url);try{ws=new WebSocket(url)}catch(e){lg("WS create fail "+e);return}ws.onopen=()=>{lg("✅ OPEN "+url);ws.send(JSON.stringify({authorize:t}))};ws.onmessage=(m)=>{lg("RX:"+m.data.slice(0,500));try{let d=JSON.parse(m.data);if(d.authorize){document.getElementById('s').textContent="Connected ✅ "+d.authorize.loginid;document.getElementById('b').textContent=d.authorize.balance+" "+d.authorize.currency;lg("✅✅ SUCCESS Bal:"+d.authorize.balance)}if(d.error)lg("❌ ERR:"+d.error.message)}catch(e){}};ws.onerror=()=>{lg("❌ WS error "+url);if(url.includes("derivws")){lg("→ Trying backup binaryws...");setTimeout(()=>connect("wss://ws.binaryws.com/websockets/v3?app_id="+document.getElementById('aid').value,t),1200)}};ws.onclose=()=>lg("WS closed")}function go(){let t=document.getElementById('pat').value.trim().replace(/\s/g,"");let a=document.getElementById('aid').value.trim()||"1089";a=a.replace(/[^0-9]/g,"");if(a.length>6)a="1089";document.getElementById('pat').value=t;document.getElementById('aid').value=a;if(t.length<60){lg("❌ PAT short len="+t.length+" need 68");return}lg("PAT len="+t.length+" App="+a);document.getElementById('s').textContent="Connecting...";connect("wss://ws.derivws.com/websockets/v3?app_id="+a,t)}</script></body></html>
