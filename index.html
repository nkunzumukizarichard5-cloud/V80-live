<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V80 LIVE PAT V81 FIXED FULL BOT</title>
<style>
body{background:#020a18;color:#00ff88;font-family:monospace;margin:0;padding:10px}
h2{text-align:center;color:#00ff88;margin:6px}
.card{background:#081428;border:1px solid #00ff88;border-radius:10px;padding:10px;margin:8px 0}
input,select{width:100%;padding:12px;margin:5px 0;background:#001122;color:#00ff88;border:1px solid #00ff88;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:14px;margin:5px 0;background:#00ff88;color:#000;font-weight:bold;border:none;border-radius:8px;font-size:16px}
button.stop{background:#ff3355;color:#fff}
#log{background:#000;border:1px solid #00ff88;height:340px;overflow:auto;padding:8px;font-size:11px;white-space:pre-wrap}
.row{display:flex;gap:6px}.row>div{flex:1}
.bal{font-size:22px;text-align:center;color:#fff}
</style>
</head>
<body>
<h2>V80 LIVE PAT V81 ✅ FIXED</h2>
<div class="card">
<input id="pat" type="text" placeholder="Paste PAT here pat_4e48... (VISIBLE)">
<input id="appid" type="text" value="1089">
<div class="row"><div><button onclick="connectPAT()">CONNECT WITH PAT</button></div><div><button class="stop" onclick="stopBot()">STOP</button></div></div>
<div class="bal">Status: <span id="status">Disconnected</span><br>Balance: <span id="bal">-</span> <span id="curr"></span></div>
</div>

<div class="card">
<div class="row">
<div><label>Stake $</label><input id="stake" type="number" value="1" step="0.35"></div>
<div><label>Martingale x</label><input id="marti" type="number" value="2.1" step="0.1"></div>
</div>
<div class="row">
<div><label>Strategy</label><select id="strat"><option value="OVER">Digit OVER 3</option><option value="UNDER">Digit UNDER 6</option><option value="EVEN">Digit EVEN</option><option value="ODD">Digit ODD</option></select></div>
<div><label>Ticks</label><input id="ticks" type="number" value="1"></div>
</div>
<button onclick="startBot()">START V80 BOT</button>
</div>

<div id="log">READY V81
