
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V83 NEW AUTH</title><style>body{background:#010a18;color:#0f8;font-family:monospace;padding:8px}input,button{width:100%;padding:12px;margin:4px 0;border-radius:6px}input{background:#001a33;color:#0f8;border:1px solid #0f8}button{background:#0f8;color:#000;font-weight:bold}#log{background:#000;border:1px solid #0f8;height:380px;overflow:auto;padding:6px;font-size:11px;white-space:pre-wrap}</style></head><body><h3>V83 NEW PAT AUTH FIXED</h3><input id=p placeholder="Paste PAT pat_..."><input id=a value="1089"><button onclick="c()">CONNECT V83</button><div id=s>Status:Off</div><div id=b>Bal:-</div><pre id=log>READY V83 NEW AUTH
Paste PAT no spaces</pre><script>function L(m){log.textContent+="\n"+new Date().toLocaleTimeString()+" "+m;log.scrollTop=log.scrollHeight}async function c(){let pat=p.value.trim(),app=a.value||"1089";if(pat.length<50){L("PAT short "+pat.length);return}L("PAT len="+pat.length+" APP="+app);s.textContent="REST /accounts...";try{let r=await fetch("https://api.derivws.com/trading/v1/options/accounts",{headers:{Authorization:"Bearer "+pat,"Deriv-App-ID":app}});let t=await r.text();L("REST "+r.status+" "+t.slice(0,500));if(!r.ok){L("REST fail, trying WS old");return old(pat,app)}let j=JSON.parse(t),acc=j.accounts||j.data||[],id=acc[0]?.id||"me";L("acc id "+id);let r2=await fetch("https://api.derivws.com/trading/v1/options/accounts/"+id+"/otp",{method:"POST",headers:{Authorization:"Bearer "+pat,"Deriv-App-ID":app,"Content-Type":"application/json"},body:"{}"});let t2=await r2.text();L("OTP "+r2.status+" "+t2.slice(0,600));let j2=JSON.parse(t2),url=j2.websocket_url||j2.data?.websocket_url;if(!url){L("no url, old");return old(pat,app)}L("WS URL "+url);let ws=new WebSocket(url);ws.onopen=()=>L("AUTH WS OPEN");ws.onmessage=e=>{L("RX "+e.data.slice(0,600));try{let d=JSON.parse(e.data);if(d.authorize||d.msg_type=="authorize"){s.textContent="OK "+(d.authorize?.loginid||"");b.textContent=(d.authorize?.balance||"")+" "+(d.authorize?.currency||"");L("✅ SUCCESS")}}catch{}};ws.onerror=()=>L("AUTH WS ERR");ws.onclose=()=>L("AUTH WS CLOSE")}catch(e){L("ERR "+e);old(pat,app)}}function old(pat,app){L("Fallback ws.derivws.com");let ws=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id="+app);ws.onopen=()=>{L("OLD OPEN");ws.send(JSON.stringify({authorize:pat}))};ws.onmessage=e=>{L("RX OLD "+e.data.slice(0,600));try{let d=JSON.parse(e.data);if(d.authorize){s.textContent="OK "+d.authorize.loginid;b.textContent=d.authorize.balance+" "+d.authorize.currency;L("✅ OLD SUCCESS")}}catch{}};ws.onerror=()=>L("OLD ERR");ws.onclose=()=>L("OLD CLOSE")}</script></body></html>
