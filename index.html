<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V85 PAT FINAL</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:8px}input,button{width:100%;padding:12px;margin:4px 0}input{background:#111;color:#0f0;border:1px solid #0f0}button{background:#0f0;color:#000;font-weight:bold}#log{background:#111;border:1px solid #0f0;height:420px;overflow:auto;padding:6px;font-size:11px;white-space:pre-wrap}</style></head><body><h3>V85 PAT FINAL</h3><input id=p placeholder="Paste PAT token pat_..."><input id=a value="1089"><button onclick="c()">CONNECT V85</button><div id=s>Status:Off</div><div id=b>Bal:-</div><pre id=log>READY V85
Paste your NEW pat_ token
App try 1089 then 59574 auto
</pre><script>function L(m){log.textContent+="\n"+new Date().toLocaleTimeString()+" "+m;log.scrollTop=log.scrollHeight}async function c(){let tok=p.value.trim();let apps=["1089","59574","16929","36812"];if(!tok.startsWith("pat_")){L("Not PAT! Need pat_ token");return}L("Token len="+tok.length+" APP test="+apps.join(","));for(let app of apps){try{L("Trying APP "+app+" at api.deriv.com");let r=await fetch("https://api.deriv.com/trading/v1/options/accounts",{headers:{Authorization:"Bearer "+tok}});let t=await r.text();L(app+" ACC "+r.status+" "+t.slice(0,400));if(r.status==401 && t.includes("application")){L("401 app invalid, try header");r=await fetch("https://api.deriv.com/trading/v1/options/accounts",{headers:{Authorization:"Bearer "+tok,"App-ID":app,"Deriv-App-ID":app}});t=await r.text();L(app+" ACC2 "+r.status+" "+t.slice(0,400))}if(r.ok){let j=JSON.parse(t),acc=j.accounts||j.data||[],id=acc[0]?.id||"me";L("Found id="+id);let r2=await fetch("https://api.deriv.com/trading/v1/options/accounts/"+id+"/otp",{method:"POST",headers:{Authorization:"Bearer "+tok,"Deriv-App-ID":app,"App-ID":app,"Content-Type":"application/json"},body:"{}"});let t2=await r2.text();L("OTP "+r2.status+" "+t2.slice(0,600));let j2=JSON.parse(t2),url=j2.websocket_url||j2.data?.websocket_url;if(url){L("WS URL OK "+url);let ws=new WebSocket(url);ws.onopen=()=>L("AUTH WS OPEN");ws.onmessage=e=>{L("RX "+e.data.slice(0,600));try{let d=JSON.parse(e.data);if(d.authorize){s.textContent="OK "+d.authorize.loginid;b.textContent=d.authorize.balance+" "+d.authorize.currency;L("✅ SUCCESS PAT "+d.authorize.loginid+" APP "+app);return}}catch{}};ws.onerror=()=>L("AUTH ERR");ws.onclose=e=>L("CLOSE "+e.code);return}else{L("No URL, try next app")}}else{L(app+" fail, next")}}catch(e){L("ERR "+app+" "+e)}}L("All apps failed. Create APP at api.deriv.com -> My Apps -> Create app with 1089? Or use legacy token ws.derivws.com")}} </script></body></html>
