<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V80 LIVE FIXED</title>
<style>
body{background:#050a14;color:#fff;font-family:monospace;padding:10px}
.card{background:#0e1e3d;border:1px solid #1a3a6a;border-radius:10px;padding:10px;margin:8px 0}
input,select,button{padding:10px;border-radius:8px;border:1px solid #2a5a9a;background:#08152e;color:#fff}
button{background:#00ff88;color:#000;font-weight:bold}
.log{background:#000;padding:8px;border-radius:8px;height:200px;overflow:auto;font-size:11px}
.price{font-size:24px;color:#00ffaa;text-align:center}
</style></head><body>
<h2 style="text-align:center;color:#00ffaa">V80 LIVE FIXED - DIRECT</h2>
<div class="card">
<input id="token" type="password" placeholder="Deriv Token" style="width:60%">
<button id="c">CONNECT</button>
<button id="d" disabled>DISC</button>
<div id="s">Status: Disconnected</div>
<div id="b">Balance: -</div>
</div>
<div class="card">
<select id="sym"><option value="R_75">R_75</option><option value="R_100">R_100</option><option value="R_50">R_50</option></select>
<select id="ct"><option value="CALL">Rise</option><option value="PUT">Fall</option></select>
<input id="st" type="number" value="1" style="width:60px">
<button id="buy" disabled>BUY</button>
<div class="price" id="p">---</div>
</div>
<div class="card"><div class="log" id="log">V80 FIXED READY - No proxy fail
1. Paste Deriv token
2. Tap CONNECT
</div></div>
<script>
let ws=null;
function L(m){let e=document.getElementById('log');e.innerHTML+='\n'+m;e.scrollTop=1e9}
function connect(){
let t=document.getElementById('token').value.trim();
if(!t){L('Paste token first');return}
ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
ws.onopen=()=>{L('WS OPEN');ws.send(JSON.stringify({authorize:t}))};
ws.onmessage=(e)=>{
let d=JSON.parse(e.data);
if(d.error){L('ERR '+d.error.message);return}
if(d.msg_type=='authorize'){L('AUTHORIZED OK '+d.authorize.loginid);document.getElementById('b').innerText='Balance: '+d.authorize.balance;document.getElementById('s').innerText='LIVE Connected';document.getElementById('c').disabled=true;document.getElementById('d').disabled=false;document.getElementById('buy').disabled=false;ws.send(JSON.stringify({ticks:'R_75',subscribe:1}));ws.send(JSON.stringify({balance:1,subscribe:1}))}
if(d.msg_type=='tick'){document.getElementById('p').innerText=d.tick.quote}
if(d.msg_type=='balance'){document.getElementById('b').innerText='Balance: '+d.balance.balance}
if(d.msg_type=='buy'){L('BUY OK ID:'+d.buy.contract_id)}
};
ws.onclose=()=>{L('Disconnected');document.getElementById('c').disabled=false}
}
document.getElementById('c').onclick=connect;
document.getElementById('d').onclick=()=>ws&&ws.close();
document.getElementById('buy').onclick=()=>{
let s=document.getElementById('sym').value,c=document.getElementById('ct').value,st=document.getElementById('st').value;
ws.send(JSON.stringify({buy:1,price:+st,parameters:{amount:+st,basis:'stake',contract_type:c,currency:'USD',duration:1,duration_unit:'t',symbol:s}}));
L('BUY '+c+' '+s+' $'+st);
};
</script></body></html>
