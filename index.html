
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>V86 PAT FIX</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:10px}input{width:100%;background:#111;color:#0f0;border:1px solid #0f0;padding:12px;margin:6px 0;box-sizing:border-box;font-size:14px}button{width:100%;background:#0f0;color:#000;border:none;padding:16px;font-weight:bold;font-size:18px;margin:10px 0}#log{border:1px solid #0f0;padding:10px;height:400px;overflow:auto;white-space:pre-wrap;background:#050505;margin-top:10px}.status{padding:8px;background:#111;border:1px solid #0f0;margin:5px 0}</style></head><body><h3 style="color:#0f0">V86 PAT FIX - WORKING</h3><input id="token" placeholder="Paste pat_ token" value="pat_520e7ace1ef0e7c00d8eb369e51b5ce88f7143ee99909eb74ce7472c63dad5d9"><input id="appid" value="1089"><button onclick="connect()" id="btn">CONNECT V86 - TAP HERE</button><div class="status">Status: <span id="st">Off</span> | Bal: <span id="bal">-</span></div><div id="log">READY V86
Click CONNECT...</div><script>let ws=null;function log(m){const el=document.getElementById('log');el.textContent+="\n"+new Date().toLocaleTimeString()+" "+m;el.scrollTop=el.scrollHeight;}function setStatus(s){document.getElementById('st').textContent=s;}function connect(){const token=document.getElementById('token').value.trim().replace(/^['"]|['"]$/g,'');let app=document.getElementById('appid').value.trim()||'1089';if(!token.startsWith('pat_')){log('ERROR: token must start with pat_');return;}log('Token len='+token.length+' App='+app);log('Token='+token.slice(0,12)+'...'+token.slice(-6));setStatus('Connecting...');document.getElementById('btn').textContent='CONNECTING... WAIT';const url='wss://ws.derivws.com/websockets/v3?app_id='+app;log('WS URL: '+url);try{ws=new WebSocket(url);}catch(e){log('WS error '+e);setStatus('Error');return;}ws.onopen=()=>{log('WS OPEN - sending authorize');ws.send(JSON.stringify({authorize:token}));};ws.onmessage=(msg)=>{log('RECV: '+msg.data.slice(0,500));try{const j=JSON.parse(msg.data);if(j.error){log('ERROR: '+j.error.code+' '+j.error.message);setStatus('Auth Fail');document.getElementById('btn').textContent='CONNECT V86 - RETRY';}if(j.msg_type==='authorize'){log('✅ AUTHORIZE SUCCESS!');log('LoginID: '+j.authorize.loginid+' Bal: '+j.authorize.balance+' '+j.authorize.currency);document.getElementById('bal').textContent=j.authorize.balance+' '+j.authorize.currency;setStatus('Connected ✅ '+j.authorize.loginid);document.getElementById('btn').textContent='CONNECTED ✅';ws.send(JSON.stringify({balance:1,subscribe:1}));}if(j.msg_type==='balance'){document.getElementById('bal').textContent=j.balance.balance+' '+j.balance.currency;}}catch(e){log('Parse err '+e)}};ws.onerror=(e)=>{log('WS ERROR '+e);setStatus('WS Error');document.getElementById('btn').textContent='RETRY CONNECT';};ws.onclose=()=>{log('WS CLOSED');if(document.getElementById('st').textContent.includes('Connecting')){setStatus('Closed - try app 59574');}};}window.onload=()=>{const p=new URLSearchParams(location.search);if(p.get('token'))document.getElementById('token').value=p.get('token');if(p.get('app'))document.getElementById('appid').value=p.get('app');if(p.get('autoconnect')==='1'){setTimeout(connect,1000);}}</script></body></html>
